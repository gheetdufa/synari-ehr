# Rendered by the nginx image at startup (/etc/nginx/templates): ${CSP_CONNECT_SRC} is replaced
# from the environment. Set it to the origins the app talks to besides its own: the LiveKit
# server (wss:// and https://) and the API when it's on another domain. See deploy/README.md.

# Hashed build assets are cached forever; index.html (every other path) is always revalidated.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 3000;
    root /usr/share/nginx/html;
    server_tokens off;
    # No access log: paths and query strings carry sign-in, invitation and video tokens
    # (/client/sign-in?token=..., /join/<token>). Errors still go to the error log.
    access_log off;

    # Headers live only at this level: an add_header inside a location would drop all of these.
    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://$host ${CSP_CONNECT_SRC}; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'self'; object-src 'self' blob:; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # SAMEORIGIN, not DENY: the app shows its own legal pages in an iframe.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;

    location / {
        # Single-page app: unknown paths serve index.html.
        try_files $uri /index.html;
    }
}
