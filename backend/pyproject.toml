[project]
name = "synari"
version = "0.1.0"
description = "Open-source practice management for therapists: scheduling, client portal, secure messaging, telehealth, documentation and billing."
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "bcrypt>=5.0",
    "boto3>=1.43",
    "cryptography>=46",
    "email-validator>=2.3",
    "fastapi>=0.141",
    "fpdf2>=2.8",
    "httpx>=0.28",
    "livekit-api>=1.2",
    "openai>=3.19",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyjwt>=2.15",
    "pyotp>=2.9",
    "pyrage>=1.4",
    "python-multipart>=0.0.32",
    "pyzipper>=0.4.0",
    "sqlalchemy>=2.1",
    "stripe>=15.6",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["synari", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "DTZ", "T20"]
ignore = [
    "B008",   # FastAPI dependency injection uses calls in defaults
    "S101",   # asserts are fine in tests
    "S105",   # flags any string assigned to *token*/*password* names (token_type="access")
    "S106",
    "RUF012", # SQLAlchemy/pydantic class attributes
]

[tool.ruff.lint.isort]
known-first-party = ["synari", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S311", "RUF001"]  # tests use look-alike characters on purpose
"perf/**" = ["S311", "T201"]  # command-line tools with fake data that print their results

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:synari.*"]
